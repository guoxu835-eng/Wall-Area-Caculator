<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU ProTakeoff | 澳洲建筑专业算量工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --primary: #fb8c00; /* 建筑橙 */
            --primary-hover: #ef6c00;
            --bg-main: #f0f2f5;
            --sidebar-bg: #ffffff;
            --toolbar-bg: #263238; /* 深灰蓝 */
            --text-main: #333333;
            --text-light: #ffffff;
            --border-color: #dee2e6;
            --accent-blue: #0288d1;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 顶部导航栏 ── */
        header {
            background: var(--toolbar-bg);
            color: var(--text-light);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--primary); }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ── 按钮样式 ── */
        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }
        .btn.primary:hover { background: var(--primary-hover); }
        
        .mode-group {
            display: flex;
            background: #1a242a;
            padding: 4px;
            border-radius: 6px;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #90a4ae;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .mode-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        /* ── 主体布局 ── */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── 侧边栏 ── */
        #sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
        }

        .sidebar-title {
            padding: 20px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        #measurements {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .measure-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            transition: transform 0.1s;
        }
        .measure-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .measure-card .m-title { font-size: 12px; color: #666; margin-bottom: 4px; }
        .measure-card .m-value { font-size: 18px; font-weight: bold; color: #222; }
        .measure-card .del-btn {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: #ccc; cursor: pointer;
        }
        .measure-card .del-btn:hover { color: #f44336; }

        .summary-panel {
            padding: 20px;
            background: #f1f8ff;
            border-top: 1px solid var(--border-color);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .total-row .label { color: #555; font-size: 13px; }
        .total-row .val { font-weight: bold; color: var(--accent-blue); font-size: 16px; }

        /* ── 画布区域 ── */
        #viewer-container {
            flex: 1;
            overflow: auto;
            background: #525659;
            position: relative;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: white;
            cursor: crosshair;
        }

        #pdf-canvas { display: block; }
        #svg-overlay {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        /* ── 辅助线 ── */
        .guide-line-h, .guide-line-v {
            position: absolute;
            background: rgba(233, 69, 96, 0.3);
            pointer-events: none;
            display: none;
        }
        .guide-line-h { width: 100%; height: 1px; left: 0; }
        .guide-line-v { height: 100%; width: 1px; top: 0; }

        /* ── 底部状态栏 ── */
        #status-bar {
            height: 30px;
            background: #eceff1;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            color: #607d8b;
        }

        /* 页码控制 */
        .page-ctrl {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            color: white;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .page-ctrl button { background: none; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="brand">AU <span>ProTakeoff</span></div>
    
    <div class="toolbar-actions">
        <label class="btn primary">
            📥 上传 PDF 图纸
            <input type="file" id="file-input" accept="application/pdf" style="display:none">
        </label>

        <div style="height: 24px; width: 1px; background: rgba(255,255,255,0.2);"></div>

        <div class="mode-group">
            <button class="mode-btn active" id="btn-area" onclick="setMode('area')">📐 面积</button>
            <button class="mode-btn" id="btn-length" onclick="setMode('length')">📏 长度</button>
        </div>

        <div style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <span>比例 1 :</span>
            <input type="number" id="scale-ratio" value="100" style="width:60px; background:#1a242a; border:1px solid #37474f; color:white; padding:4px 8px; border-radius:4px;">
        </div>

        <button class="btn" onclick="undoPoint()">↩ 撤销点</button>
        <button class="btn" onclick="finishShape()">✅ 完成</button>
    </div>

    <div style="display:flex; gap:10px;">
        <button class="btn" onclick="changeZoom(-0.2)">➖</button>
        <span id="zoom-label" style="min-width:45px; text-align:center; font-size:13px;">100%</span>
        <button class="btn" onclick="changeZoom(0.2)">➕</button>
    </div>
</header>

<div class="main-container">
    <div id="viewer-container">
        <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <svg id="svg-overlay"></svg>
            <div id="h-guide" class="guide-line-h"></div>
            <div id="v-guide" class="guide-line-v"></div>
        </div>

        <div class="page-ctrl" id="page-controls" style="display:none;">
            <button onclick="changePage(-1)">上页</button>
            <span id="page-info">1 / 1</span>
            <button onclick="changePage(1)">下页</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-title">
            <span>测量清单 (Takeoff List)</span>
            <button onclick="clearAll()" style="font-size:11px; color:#f44336; border:none; background:none; cursor:pointer;">全部清除</button>
        </div>
        <div id="measurements">
            <div style="text-align:center; color:#999; margin-top:40px; font-size:13px;">暂无数据，请在图纸上点击开始</div>
        </div>
        
        <div class="summary-panel">
            <div class="total-row">
                <span class="label">合计总面积</span>
                <span class="val" id="total-area">0.00 m²</span>
            </div>
            <div class="total-row">
                <span class="label">合计总长度</span>
                <span class="val" id="total-length">0.00 m</span>
            </div>
        </div>
    </div>
</div>

<div id="status-bar">就绪。请上传图纸开始算量。</div>

<script>
    // JS 逻辑保持并增强
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let pdfDoc = null, currentPage = 1, totalPages = 1, zoomLevel = 1.2;
    let mode = 'area', currentPoints = [], measurements = [], measureCount = 0;
    const COLORS = ['#fb8c00', '#0288d1', '#4caf50', '#9c27b0', '#f44336'];

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const svg = document.getElementById('svg-overlay');
    const hGuide = document.getElementById('h-guide');
    const vGuide = document.getElementById('v-guide');

    // 处理文件上传
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('status-bar').innerText = "正在解析 PDF...";
        const arrayBuf = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument(new Uint8Array(arrayBuf)).promise;
        totalPages = pdfDoc.numPages;
        currentPage = 1;
        
        document.getElementById('page-controls').style.display = 'flex';
        renderPage(currentPage);
    });

    async function renderPage(num) {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: zoomLevel * 1.5 });

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        svg.setAttribute('width', viewport.width);
        svg.setAttribute('height', viewport.height);
        
        await page.render({ canvasContext: ctx, viewport }).promise;
        
        document.getElementById('page-info').innerText = `${num} / ${totalPages}`;
        document.getElementById('status-bar').innerHTML = `当前图纸：第 ${num} 页 | <span>比例尺 1:${document.getElementById('scale-ratio').value}</span>`;
        redrawSVG();
    }

    // 画布交互
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // 更新辅助线
        hGuide.style.display = vGuide.style.display = 'block';
        hGuide.style.top = y + 'px';
        vGuide.style.left = x + 'px';

        if (currentPoints.length > 0) {
            redrawSVG({ x: x * (canvas.width/rect.width), y: y * (canvas.height/rect.height) });
        }
    });

    canvas.addEventListener('mouseleave', () => {
        hGuide.style.display = vGuide.style.display = 'none';
    });

    canvas.addEventListener('click', (e) => {
        if (!pdfDoc) return;
        const rect = canvas.getBoundingClientRect();
        currentPoints.push({
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        });
        redrawSVG();
    });

    // 模式切换
    function setMode(m) {
        finishShape();
        mode = m;
        document.getElementById('btn-area').classList.toggle('active', m === 'area');
        document.getElementById('btn-length').classList.toggle('active', m === 'length');
    }

    function changeZoom(delta) {
        zoomLevel = Math.max(0.5, Math.min(3, zoomLevel + delta));
        document.getElementById('zoom-label').innerText = Math.round(zoomLevel * 100) + '%';
        if (pdfDoc) renderPage(currentPage);
    }

    function changePage(delta) {
        const target = currentPage + delta;
        if (target >= 1 && target <= totalPages) {
            finishShape();
            currentPage = target;
            renderPage(currentPage);
        }
    }

    // 核心计算逻辑
    function finishShape() {
        if (currentPoints.length < (mode === 'area' ? 3 : 2)) {
            currentPoints = []; redrawSVG(); return;
        }

        const ratio = parseFloat(document.getElementById('scale-ratio').value) || 100;
        const pxPerMetre = (zoomLevel * 1.5) * 72 * 39.37 / ratio;

        let val = 0;
        if (mode === 'area') {
            let area = 0;
            for (let i = 0; i < currentPoints.length; i++) {
                let j = (i + 1) % currentPoints.length;
                area += currentPoints[i].x * currentPoints[j].y;
                area -= currentPoints[j].x * currentPoints[i].y;
            }
            val = Math.abs(area) / 2 / (pxPerMetre * pxPerMetre);
        } else {
            for (let i = 1; i < currentPoints.length; i++) {
                val += Math.hypot(currentPoints[i].x - currentPoints[i-1].x, currentPoints[i].y - currentPoints[i-1].y);
            }
            val /= pxPerMetre;
        }

        measurements.push({
            id: Date.now(),
            mode,
            points: [...currentPoints],
            value: val,
            page: currentPage,
            color: COLORS[measurements.length % COLORS.length]
        });

        currentPoints = [];
        updateSidebar();
        redrawSVG();
    }

    function redrawSVG(mousePos) {
        svg.innerHTML = '';
        measurements.filter(m => m.page === currentPage).forEach(m => drawPath(m.points, m.color, m.mode, false));
        if (currentPoints.length > 0) {
            const pts = mousePos ? [...currentPoints, mousePos] : currentPoints;
            drawPath(pts, '#fb8c00', mode, true);
        }
    }

    function drawPath(pts, color, type, isTemp) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        let d = `M ${pts[0].x} ${pts[0].y} ` + pts.slice(1).map(p => `L ${p.x} ${p.y}`).join(' ');
        if (type === 'area' && pts.length > 2) d += ' Z';
        
        path.setAttribute('d', d);
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', type === 'area' ? color : 'none');
        path.setAttribute('fill-opacity', '0.2');
        if (isTemp) path.setAttribute('stroke-dasharray', '5,5');
        svg.appendChild(path);
        
        pts.forEach(p => {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y);
            circle.setAttribute('r', isTemp ? '4' : '2');
            circle.setAttribute('fill', 'white');
            circle.setAttribute('stroke', color);
            svg.appendChild(circle);
        });
    }

    function updateSidebar() {
        const container = document.getElementById('measurements');
        container.innerHTML = '';
        let totalA = 0, totalL = 0;

        measurements.forEach(m => {
            if (m.mode === 'area') totalA += m.value; else totalL += m.value;
            const card = document.createElement('div');
            card.className = 'measure-card';
            card.style.borderLeft = `4px solid ${m.color}`;
            card.innerHTML = `
                <button class="del-btn" onclick="deleteM(${m.id})">✕</button>
                <div class="m-title">${m.mode === 'area' ? '📐 区域面积' : '📏 线性长度'} (第${m.page}页)</div>
                <div class="m-value">${m.value.toFixed(2)} ${m.mode === 'area' ? 'm²' : 'm'}</div>
            `;
            container.appendChild(card);
        });

        document.getElementById('total-area').innerText = totalA.toFixed(2) + ' m²';
        document.getElementById('total-length').innerText = totalL.toFixed(2) + ' m';
    }

    function deleteM(id) {
        measurements = measurements.filter(m => m.id !== id);
        updateSidebar();
        redrawSVG();
    }

    function undoPoint() {
        currentPoints.pop();
        redrawSVG();
    }

    function clearAll() {
        if(confirm('确定要清除所有测量数据吗？')) {
            measurements = [];
            currentPoints = [];
            updateSidebar();
            redrawSVG();
        }
    }
</script>
</body>
</html>
